services:
  postgres:
    image: postgres:16-alpine
    container_name: release-checklist-db
    environment:
      POSTGRES_DB: release_checklist
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./Backend
    container_name: release-checklist-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/release_checklist
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.frontend
    container_name: release-checklist-frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend

volumes:
  pgdata:
